  #     - uses: actions/setup-java@v4
  #       with:
  #         distribution: temurin
  #         java-version: '17'
  #     - uses: dtolnay/rust-toolchain@1.88.0
  #       with:
  #         targets: aarch64-linux-android
  #     - run: python3 native/scripts/build_native.py --fetch-ndk
  #     - run: python3 native/scripts/build_native.py --target android-arm64 --stage jni
  #     - run: mvn -s .mvn/settings.xml verify
