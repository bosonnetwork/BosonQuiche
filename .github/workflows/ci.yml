name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MAVEN_ARGS: -B -ntp

# Verification only. Release artifacts come from the pinned builder path
# described in RELEASING.md, because runner images drift and the frozen-checksum
# model requires byte-identical rebuilds.
jobs:
  python:
    name: Python tooling and generated sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Native tooling tests
        run: python3 -m unittest discover -s native/scripts/tests -q

      - name: Release tooling tests
        run: python3 -m unittest discover -s scripts/tests -q

      - name: Generated sources match the pinned header
        run: python3 scripts/generate_api.py --check

  macos-arm64:
    name: macOS arm64 (host Maven build)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: llvm-tools

      - name: Verify
        run: mvn -s .mvn/settings.xml verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-reports
          path: |
            api/target/surefire-reports/**
            native/target/native-install/native/*/build-info.json
          if-no-files-found: ignore

  linux-amd64:
    name: Linux amd64 (glibc 2.28 builder)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET: linux-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: llvm-tools

      - name: Host build and JNI suite
        run: mvn -s .mvn/settings.xml verify

      - name: Build the pinned Linux builder image
        run: |
          docker buildx build --platform linux/amd64 \
              -f native/docker/Dockerfile.linux \
              -t boson-quiche-toolchain:linux-amd64 --load native/docker

      - name: Stage the release-grade library
        run: python3 native/scripts/build_native.py --target "$TARGET" --stage jni --test-natives

      - name: Run the JNI suite against the staged library
        run: python3 native/scripts/test_runtime.py --target "$TARGET"

  linux-arm64:
    name: Linux arm64 (glibc 2.28 builder)
    # Requires GitHub's arm64 hosted runner. Without it, mirror this job on
    # ubuntu-24.04 behind docker/setup-qemu-action, which is much slower.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      TARGET: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: llvm-tools

      - name: Host build and JNI suite
        run: mvn -s .mvn/settings.xml verify

      - name: Build the pinned Linux builder image
        run: |
          docker buildx build --platform linux/arm64 \
              -f native/docker/Dockerfile.linux \
              -t boson-quiche-toolchain:linux-arm64 --load native/docker

      - name: Stage the release-grade library
        run: python3 native/scripts/build_native.py --target "$TARGET" --stage jni --test-natives

      - name: Run the JNI suite against the staged library
        run: python3 native/scripts/test_runtime.py --target "$TARGET"

  # Android arm64 qualification needs an emulator with a KVM-enabled runner and a
  # third-party emulator action. It stays manual until that is reviewed; the AAR
  # build itself is covered by the macOS job above.
