plugins {
    id 'com.android.application' version '8.9.1'
}

layout.buildDirectory = file('../../target/consumer-android')

android {
    namespace 'io.bosonnetwork.quiche.consumer'
    compileSdk 36

    defaultConfig {
        applicationId 'io.bosonnetwork.quiche.consumer'
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName '1'
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets {
        main.java.srcDir '../consumer-common/src/main/java'
        main.assets.srcDir '../../src/test/resources'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    signingConfigs {
        consumer {
            storeFile file(providers.gradleProperty('consumerKeystore').get())
            storePassword 'consumer-test'
            keyAlias 'consumer-test'
            keyPassword 'consumer-test'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            signingConfig signingConfigs.consumer
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

dependencies {
    implementation "io.bosonnetwork:boson-quiche-android:${providers.gradleProperty('bosonVersion').get()}"
}

tasks.register('resolvedBosonArtifacts') {
    doLast {
        configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts
            .findAll { it.moduleVersion.id.group == 'io.bosonnetwork' }
            .each { println "BOSON_ARTIFACT ${it.file.name}" }
    }
}
